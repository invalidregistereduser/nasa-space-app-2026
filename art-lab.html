<!doctype html>
<html lang="en">
  <head>

    <title>MARS — procedural art lab</title>
    <style>
      body { background: #0b0d12; color: #9fb3c8; font: 13px/1.5 ui-monospace, monospace; margin: 0; padding: 18px; }
